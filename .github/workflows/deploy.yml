# Copy-adapted from ldz-kit/react/scaffolds/deploy/.github/workflows/deploy.yml
# Docs: ldz-kit/infra/deploy.md

name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Execute deployment script
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          set -e
          echo "🚀 Starting E30 Gallery frontend deployment..."
          ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ env.USERNAME }}@${{ env.HOST }} "
            set -e
            cd /home/lando/frontend/repo || exit 1
            [ ! -f 'scripts/deploy.sh' ] && echo '❌ Deploy script not found!' && exit 1
            bash scripts/deploy.sh
          "
          EXIT_STATUS=$?
          if [ $EXIT_STATUS -eq 0 ]; then
            echo ""
            echo "✅ Deployment completed successfully"
          else
            echo ""
            echo "❌ Deployment failed with exit status $EXIT_STATUS"
            echo "💡 SSH into the server and check: pm2 logs e30-frontend --lines 80"
          fi
          exit $EXIT_STATUS

      - name: Verify deployment
        if: success()
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo ""
          echo "🔍 Verifying deployment..."
          ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ env.USERNAME }}@${{ env.HOST }} "
            echo '📊 PM2 Status:'
            pm2 show e30-frontend 2>/dev/null | grep -E 'status|exec cwd|script path' || pm2 list
            echo ''
            APP_STATUS=\$(curl -sf http://localhost:5173 > /dev/null 2>&1 && echo 'ok' || echo 'error')
            echo '🏥 Health Check:'
            echo \"   Frontend: [\$APP_STATUS]\"
          " 2>&1 | grep -v "^Warning:" || true

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Notify via Resend
        uses: brunosj/actions/resend-notify@v1
        with:
          subject: 'GitHub Actions - Deploy E30 Gallery Failed'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
