# Copy-adapted from ldz-kit/react/scaffolds/deploy/.github/workflows/deploy.yml
# Docs: ldz-kit/infra/deploy.md

name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret not set; falling back to ssh-keyscan (pin the host key, see ldz-kit/infra/deploy.md)"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Execute deployment script
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo "🚀 Starting E30 Gallery frontend deployment..."
          set +e
          ssh -o LogLevel=ERROR "$USERNAME@$HOST" "
            set -e
            if [ ! -d /home/lando/frontend/repo ]; then
              echo '❌ Missing /home/lando/frontend/repo'
              echo '   Create it once on the VPS (e.g. mv /home/lando/frontend/app-blue /home/lando/frontend/repo)'
              echo '   then re-run this workflow.'
              ls -la /home/lando/frontend/ || true
              exit 1
            fi
            cd /home/lando/frontend/repo
            git fetch origin --quiet
            git reset --hard origin/main --quiet
            [ ! -f 'scripts/deploy.sh' ] && echo '❌ Deploy script not found!' && exit 1
            bash scripts/deploy.sh
          "
          EXIT_STATUS=$?
          set -e
          if [ $EXIT_STATUS -eq 0 ]; then
            echo ""
            echo "✅ Deployment completed successfully"
          else
            echo ""
            echo "❌ Deployment failed with exit status $EXIT_STATUS"
            echo "💡 SSH into the server and check: pm2 logs e30-frontend --lines 80"
          fi
          exit $EXIT_STATUS

      - name: Verify deployment
        if: success()
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo ""
          echo "🔍 Verifying deployment..."
          ssh -o LogLevel=ERROR "$USERNAME@$HOST" "
            echo '📊 PM2 Status:'
            pm2 show e30-frontend 2>/dev/null | grep -E 'status|exec cwd|script path' || pm2 list
            echo ''
            HTTP_CODE=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/api/health || true)
            echo '🏥 Health Check (/api/health):'
            echo \"   Frontend: [HTTP \$HTTP_CODE]\"
          " 2>&1 | grep -v "^Warning:" || true

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Notify via Resend
        uses: brunosj/actions/resend-notify@v1
        with:
          subject: 'GitHub Actions - Deploy E30 Gallery Failed'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
